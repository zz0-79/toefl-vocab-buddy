<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>词途 · TOEFL 词汇伙伴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <h1>词途</h1>
        <p class="tagline">输入生词 · 科学复习</p>
      </div>
      <div class="header-meta">
        <span class="meta-item">今日 <strong id="todayCount">0</strong>/<strong id="goalDisplay">3</strong></span>
        <span class="meta-item">🔥 <strong id="streakCount">0</strong> 天</span>
        <span class="meta-item">Lv.<strong id="levelDisplay">1</strong></span>
        <button type="button" id="checkInBtn" class="btn btn-checkin btn-sm">打卡</button>
      </div>
    </header>

    <!-- 核心：查词输入 -->
    <section class="search-hero" aria-labelledby="search-label">
      <label id="search-label" for="wordInput">输入单词（阅读 / 作业里遇到的生词）</label>
      <div class="search-row">
        <input
          type="text"
          id="wordInput"
          class="word-input"
          placeholder="例如 ambiguous"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="search"
        />
        <button type="button" id="lookupBtn" class="btn btn-primary">查询</button>
      </div>
      <div id="recentWords" class="recent-chips" aria-label="最近查询"></div>
    </section>

    <!-- 主学习区 -->
    <section class="learn-focus" aria-live="polite">
      <div class="focus-toolbar">
        <span id="learnModeTag" class="mode-tag">新词学习</span>
        <button type="button" id="randomWordBtn" class="btn-text">或：随机推荐一词 →</button>
      </div>

      <div id="wordCard" class="word-card loading">
        <p class="loading-text">输入单词并点「查询」，或点随机推荐</p>
      </div>

      <div class="word-actions" id="learnActions">
        <button type="button" id="playAudioBtn" class="btn btn-ghost" disabled>🔊 发音</button>
        <button type="button" id="favoriteBtn" class="btn btn-ghost" disabled>☆ 收藏</button>
        <button type="button" id="masteredBtn" class="btn btn-success" disabled>✓ 已掌握</button>
      </div>
      <div class="word-actions hidden" id="reviewActions">
        <button type="button" id="playAudioReviewBtn" class="btn btn-ghost" disabled>🔊 发音</button>
        <button type="button" id="reviewPassBtn" class="btn btn-success">记住了</button>
        <button type="button" id="reviewFailBtn" class="btn btn-ghost">忘了</button>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar" id="dailyProgressBar" style="width: 0%"></div>
      </div>
      <p id="encouragement" class="encouragement"></p>
    </section>

    <!-- 底部导航：收起次要功能 -->
    <nav class="bottom-nav" role="tablist" aria-label="功能导航">
      <button type="button" class="nav-btn" data-view="review" role="tab">复习 <span id="navDueBadge" class="nav-badge hidden">0</span></button>
      <button type="button" class="nav-btn" data-view="wordbank" role="tab">词库</button>
      <button type="button" class="nav-btn" data-view="more" role="tab">更多</button>
    </nav>

    <div id="panelReview" class="bottom-panel hidden">
      <h2 class="panel-title">艾宾浩斯复习</h2>
      <p class="panel-desc">第 2 天复习昨天学的词 · 遗忘高峰在 24 小时内</p>
      <div class="srs-inline">
        <span>待复习 <strong id="dueReviewCount">0</strong></span>
        <span>已复习 <strong id="todayReviewDone">0</strong></span>
        <span>距周测 <strong id="daysToQuiz">—</strong></span>
      </div>
      <ul id="dueReviewList" class="due-list"></ul>
      <button type="button" id="startReviewBtn" class="btn btn-secondary btn-block" disabled>开始复习</button>
      <div id="quizBanner" class="quiz-inline hidden">
        <button type="button" id="startQuizBtn" class="btn btn-primary btn-block">开始周测（5 题）</button>
      </div>
      <section id="quizPanel" class="quiz-panel hidden" aria-live="polite">
        <p class="quiz-progress"><span id="quizIndex">1</span> / <span id="quizTotal">5</span></p>
        <p id="quizQuestion" class="quiz-question"></p>
        <div id="quizOptions" class="quiz-options"></div>
        <p id="quizFeedback" class="quiz-feedback"></p>
      </section>
    </div>

    <div id="panelWordbank" class="bottom-panel hidden">
      <div class="list-header">
        <h2 class="panel-title">我的词库</h2>
        <button type="button" id="clearAllBtn" class="btn btn-danger btn-sm">清空</button>
      </div>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="mastered">已掌握</button>
        <button type="button" class="tab" data-tab="favorites">收藏</button>
        <button type="button" class="tab" data-tab="srs">复习日程</button>
      </div>
      <ul id="wordList" class="word-list"></ul>
    </div>

    <div id="panelMore" class="bottom-panel hidden">
      <details class="more-block" open>
        <summary>今日状态</summary>
        <div class="mood-grid" role="group">
          <button type="button" class="mood-btn" data-mood="great">😊</button>
          <button type="button" class="mood-btn" data-mood="ok">😐</button>
          <button type="button" class="mood-btn" data-mood="tired">😩</button>
          <button type="button" class="mood-btn" data-mood="anxious">😰</button>
        </div>
        <p id="moodFeedback" class="mood-feedback" hidden></p>
        <label for="dailyGoal">每日新词目标</label>
        <div class="goal-row">
          <input type="range" id="dailyGoal" min="1" max="30" value="3" />
          <output id="goalOutput" for="dailyGoal">3</output>
          <button type="button" id="saveGoalBtn" class="btn btn-ghost btn-sm">保存</button>
        </div>
        <div class="xp-bar-wrap"><div class="xp-bar" id="xpBar" style="width: 0%"></div></div>
        <p class="hint">XP <strong id="xpDisplay">0</strong> · 掌握+10 · 复习+15</p>
        <div id="badgeRow" class="badge-row"></div>
      </details>

      <details class="more-block">
        <summary>词汇闯关</summary>
        <p id="gameScore" class="hint">最高分：<strong>0</strong></p>
        <button type="button" id="startGameBtn" class="btn btn-secondary btn-block">开始闯关</button>
        <div id="gameArea" class="game-area hidden">
          <p id="gameWord" class="game-word"></p>
          <div id="gameOptions" class="quiz-options"></div>
        </div>
      </details>

      <details class="more-block">
        <summary>微习惯 & 减压（API）</summary>
        <blockquote id="adviceText" class="quote-box">点击获取建议</blockquote>
        <button type="button" id="fetchAdviceBtn" class="btn btn-secondary btn-block">获取建议</button>
        <div id="relaxImageWrap" class="relax-wrap"><p class="placeholder">治愈图</p></div>
        <button type="button" id="fetchRelaxBtn" class="btn btn-secondary btn-block">换治愈图</button>
      </details>
    </div>

    <footer class="footer">
      <p>数据保存在本机 · <a href="https://github.com/zz0-79/toefl-vocab-buddy" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
